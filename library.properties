sentence=Easy TM1637 4- and 6-digit 7-segment display library: numbers, decimals, clock with colon, text, scrolling, brightness. No dependencies.
paragraph=Drives the popular TM1637 4-digit and 6-digit display modules with showNumber(), showFloat(), showTime(), showTimeHMS() and showText(): right-aligned numbers with minus sign, decimal point on the right digit, blinking colon, scrolling text and brightness. The odd digit order of 6-digit modules is handled for you and can be changed with setDigitMap(). begin() reports a missing display and explains wiring problems in Russian, Kazakh or English. Works on any two pins, no dependencies.
