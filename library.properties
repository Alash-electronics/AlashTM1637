sentence=Easy TM1637 4-digit 7-segment display library: numbers, decimals, clock with colon, text, scrolling, brightness. No dependencies.
paragraph=Drives the popular TM1637 4-digit display module with showNumber(), showFloat(), showTime() and showText(): right-aligned numbers with minus sign, decimal point on the right digit, blinking colon for clocks, letters and scrolling text, brightness 0-7, and tells in Russian, Kazakh or English when the display does not answer. Works on Arduino AVR, ESP32, ESP8266 with any two digital pins. Examples included, made for classes and kits by Alash Electronics.
